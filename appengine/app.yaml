runtime: python312 # Or your preferred runtime

handlers:
# 1. Serve static files from the 'public' directory
- url: /static
  static_dir: public

# 2. Serve the root index.html when visiting the homepage
- url: /
  static_files: public/index.html
  upload: public/index.html
  secure: always

# 3. Catch-all for any other files in 'public' (optional)
- url: /(.*)
  static_files: public/\1
  upload: public/(.*)
  secure: always