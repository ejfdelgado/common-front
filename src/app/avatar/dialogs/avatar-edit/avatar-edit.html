<h2 mat-dialog-title>{{ "popup.avatar.title" | translate : "avatar" | async }}</h2>

<mat-dialog-content class="dialog_content text_size_x2">
    <mat-tab-group class="full-width">

        <mat-tab [label]="'popup.performance.tabs.general.title' | translate : 'avatar' | async">
            <form [formGroup]="generalForm" class="tab_content">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Malla</mat-label>
                    <mat-select formControlName="meshPath">
                        @for (option of meshOptions; track option.value) {
                        <mat-option [value]="option.value">{{ option.label }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </form>
        </mat-tab>

    </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()">
        <mat-icon>close</mat-icon>
        {{ "buttons.cancel" | translate : "general" | async }}
    </button>

    <button mat-flat-button color="primary" (click)="save()">
        <mat-icon>check</mat-icon>
        {{ "buttons.save" | translate : "general" | async }}
    </button>
</mat-dialog-actions>
