<h2 mat-dialog-title>{{ "popup.avatar.title" | translate : "avatar" | async }}</h2>

<mat-dialog-content class="dialog_content text_size_x2">
    <mat-tab-group class="full-width">

        <mat-tab [label]="('popup.avatar.tabs.general.title' | translate : 'avatar' | async) ?? ''">
            <div class="tab_content">
                <p>{{ "popup.avatar.tabs.general.character.label" | translate : "avatar" | async }}</p>
                <app-photo-gallery [gallery]="gallery" (currentImage)="selectItem($event)"></app-photo-gallery>
            </div>
        </mat-tab>

    </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()">
        <mat-icon>close</mat-icon>
        {{ "buttons.cancel" | translate : "general" | async }}
    </button>

    <button mat-flat-button color="primary" (click)="save()">
        <mat-icon>check</mat-icon>
        {{ "buttons.save" | translate : "general" | async }}
    </button>
</mat-dialog-actions>
