<h2 mat-dialog-title>{{ "popup.world.title" | translate : "avatar" | async }}</h2>

<mat-dialog-content class="dialog_content text_size_x2">
    <mat-tab-group class="full-width">

        <mat-tab label="General">
            <form [formGroup]="generalForm" class="tab_content">
                <app-on-off-toggle [label]="'popup.world.tabs.general.peer2peer.label' | translate : 'avatar' | async"
                    [iconName]="'checkbox'" formControlName="useLivePeer"></app-on-off-toggle>
                <app-on-off-toggle [label]="'popup.world.tabs.general.use_voice.label' | translate : 'avatar' | async"
                    [iconName]="'checkbox'" formControlName="useVoice"></app-on-off-toggle>
            </form>
        </mat-tab>

    </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()">
        <mat-icon>close</mat-icon>
        {{ "buttons.cancel" | translate : "general" | async }}
    </button>

    <button mat-flat-button color="primary" (click)="save()">
        <mat-icon>check</mat-icon>
        {{ "buttons.save" | translate : "general" | async }}
    </button>
</mat-dialog-actions>
