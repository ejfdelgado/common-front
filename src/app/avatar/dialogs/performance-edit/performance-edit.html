<h2 mat-dialog-title>{{ "popup.performance.title" | translate : "avatar" | async }}</h2>

<mat-dialog-content class="dialog_content text_size_x2">
    <mat-tab-group class="full-width">

        <mat-tab label="General">
            <form [formGroup]="generalForm" class="tab_content">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>{{ "popup.performance.tabs.general.model.label" | translate : "avatar" | async
                        }}</mat-label>
                    <mat-select formControlName="pose">
                        @for (option of poseOptions; track option.id) {
                        <mat-option [value]="option.id">{{ option.name }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
                <app-on-off-toggle
                    [label]="'popup.performance.tabs.general.check_people_behind.label' | translate : 'avatar' | async"
                    [iconName]="'checkbox'" formControlName="filterBackPeople"></app-on-off-toggle>
            </form>
        </mat-tab>

    </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()">
        <mat-icon>close</mat-icon>
        {{ "buttons.cancel" | translate : "general" | async }}
    </button>

    <button mat-flat-button color="primary" (click)="save()">
        <mat-icon>check</mat-icon>
        {{ "buttons.save" | translate : "general" | async }}
    </button>
</mat-dialog-actions>
