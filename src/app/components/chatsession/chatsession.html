<mat-sidenav-container>
    <mat-sidenav #sidenav [mode]="'over'" [opened]="false">

    </mat-sidenav>
    <mat-sidenav-content class="vertical_flex">
        <mat-toolbar>
            @if (assistant) {
            <div class="profile_detail">
                <div class="logo_image"
                    [style.background-image]="'url(' + getBucketFilePathWithType(assistant.image, 'square') + ')'">
                </div>
                <div class="profile_title"><span>{{ assistant.title }}</span></div>
            </div>
            }
            <div class="right_button">
                <button mat-icon-button color="primary" [matMenuTriggerFor]="menu2" aria-label="Open menu">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu2="matMenu">
                    <button mat-menu-item (click)="clearHistory()">
                        <mat-icon>delete</mat-icon>
                        <span>Borrar historial</span>
                    </button>
                    <button mat-menu-item (click)="contactUs()">
                        <mat-icon>question_mark</mat-icon>
                        <span>¿Cómo funciona este asistente?</span>
                    </button>
                </mat-menu>
            </div>
        </mat-toolbar>
        <div class="scrolled_messages_parent">
            <div #scrolled_container class="scrolled_messages">
                <div class="fill_height"></div>
                @if (showSplash && assistant) {
                <app-splash [assistant]="assistant"></app-splash>
                }
                @for (message of visualHistory; track message.date) {
                @if (message.gallery) {
                <div class="single_msg">
                    <app-photo-gallery [gallery]="message.gallery"></app-photo-gallery>
                </div>
                } @else {
                <div class="single_msg" [ngClass]="'rol_'+message.role">
                    <span class="text" [innerHTML]="message.txt"></span>
                </div>
                }
                }
            </div>
        </div>
        <div class="botton_controls">
            <mat-form-field appearance="outline" class="query_field no_subscript">
                <textarea matInput [(ngModel)]="query" name="query" (keydown.enter)="sendMessage()"></textarea>
            </mat-form-field>
            <button matIconButton aria-label="">
                <mat-icon (click)="sendMessage()">send</mat-icon>
            </button>
            @if (loading > 0) {
            <div class="indicator">
                <img src="/assets/img/loading4.gif">
            </div>
            }
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
