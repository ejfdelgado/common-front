<div class="editable-wrapper visible" [ngClass]="{'focused': focused}">
    <!-- Toolbar -->
    <div class="toolbar">
        <button type="button" (mousedown)="format('bold', $event)" aria-label="Bold">
            <b>b</b>
        </button>

        <button type="button" (mousedown)="format('italic', $event)" aria-label="Italic">
            <i>It</i>
        </button>

        <button type="button" (mousedown)="openEmoticons()" aria-label="Italic">
            <span>😎</span>
        </button>
    </div>
    <div class="parent_preview"
        [ngStyle]="{'min-height': (minHeight ? minHeight : 6)+'em', 'max-height': (maxHeight ? maxHeight : 10)+'em'}">
        <div #scrollContainer class="parent_content fill_width">
            <div #editable [ngClass]="{'with_focus': focused}" class="editable-input" contenteditable="true"
                role="textbox" aria-multiline="false" [attr.data-placeholder]="placeholder" [class.empty]="!value"
                [class.disabled]="disabled" [attr.tabindex]="disabled ? -1 : 0" (focus)="onFocus()" (blur)="onBlur()"
                (input)="onInput()" (keyup)="saveSelection()" (mouseup)="saveSelection()" (paste)="onPaste($event)">
            </div>
        </div>
        <div class="preview_scroll_content fill_width" [innerHTML]="preview">

        </div>
    </div>
</div>
