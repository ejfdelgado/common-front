<div class="phone-container">
    <mat-form-field appearance="outline" class="prefix">
        <mat-select [disabled]="disabled" [(ngModel)]="value.prefix" (selectionChange)="update()">
            @for(p of prefixes; track p) {
            <mat-option [value]="p">
                {{ p }}
            </mat-option>
            }
        </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="phone-field">
        <mat-label>{{ label }}</mat-label>
        <input matInput type="tel" placeholder="Phone number" [disabled]="disabled" [(ngModel)]="value.number"
            (ngModelChange)="update()" />
    </mat-form-field>
</div>
@if (touched && hasError('required')) {
<mat-error>
    Phone number is required
</mat-error>
}
@if (touched && hasError('invalidPhone')) {
<mat-error>
    Phone number must be exactly 10 digits
</mat-error>
}
