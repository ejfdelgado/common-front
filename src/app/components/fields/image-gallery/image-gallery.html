<div class="list">
    <div class="inter_row first">
        <div class="container_centered">
            <mat-icon class="custom_buttom custom_buttom_black add_button" (click)="add(0)">add</mat-icon>
        </div>
    </div>
    @for (group of formArray.controls; let i = $index; track group) {
    <div class="row" [formGroup]="group">
        <div class="inputs">
            <app-image-field [formControl]="getFormControlNamed('image', group)" [config]="config"></app-image-field>

            <app-editable-input [discrete]="false" [formControl]="getFormControlNamed('description', group)"
                [placeholder]="'Descripción...'" [maxHeight]="'6em'" [minHeight]="'6em'"></app-editable-input>
        </div>
        <div class="bottom_controls">
            @if (i != 0) {
            <mat-icon class="custom_buttom custom_buttom_black move_button" (click)="moveUp(i)">chevron_left</mat-icon>
            }
            <div class="space"></div>
            @if (i != formArray.controls.length - 1) {
            <mat-icon class="custom_buttom custom_buttom_black move_button"
                (click)="moveDown(i)">chevron_right</mat-icon>
            }
        </div>

        <mat-icon class="custom_buttom remove_button white_subtitle" (click)="remove(i)">close</mat-icon>
        <div class="container_centered">
            <mat-icon class="custom_buttom custom_buttom_black add_button" (click)="add(i+1)">add</mat-icon>
        </div>
    </div>
    }
</div>
