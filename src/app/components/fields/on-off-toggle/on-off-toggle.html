<div class="field_container noselect" [ngClass]="{'disabled': disabled}">
    @if (value) {
    <img (click)="toggle()" class="image_class" [src]="onImageUrl">
    } @else {
    <img (click)="toggle()" class="image_class" [src]="offImageUrl">
    }
    <span (click)="toggle()">{{ label }}</span>
    <div></div>
</div>
