<div class="field_container noselect" [ngClass]="{'disabled': disabled}">
  <span class="slider_label">{{ label }}</span>
  <input class="slider_input" type="range" [min]="getMin()" [max]="getMax()" [value]="value ?? getMin()"
    [disabled]="disabled" (input)="onSliderChange($event)" />
  <span class="slider_value">{{ value ?? getMin() }}</span>
</div>
