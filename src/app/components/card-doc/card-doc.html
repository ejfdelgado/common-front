<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image" [style.background-image]="'url(' + model.author_picture + ')'">
    </div>
    <mat-card-title>{{ model.title }}</mat-card-title>
    <mat-card-subtitle>{{ model.author_name }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu">
  <mat-card-content>
    <span class="text_date white_subtitle">Jan 13, 2026</span>
    <p class="content_parent" [innerHTML]="sanitizeText(model.description)"></p>
  </mat-card-content>
  <mat-card-actions>
    @if (user && user.id == model.author) {
    <button matButton (click)="openEdit()"><mat-icon>edit</mat-icon>Editar</button>
    }
    <button matButton (click)="share()"><mat-icon>share</mat-icon>Compartir</button>
  </mat-card-actions>
</mat-card>
