<mat-card appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="header-image" [style.background-image]="'url(' + model.author_picture + ')'">
    </div>
    <mat-card-title>{{ model.title }}</mat-card-title>
    <mat-card-subtitle>{{ model.author_name }}</mat-card-subtitle>
  </mat-card-header>
  @if (model.image) {
  <div class="image_preview_parent">
    <div class="image_preview_blur" [style.background-image]="'url(' + getBucketFilePath(model.image) + ')'"></div>
    <div class="image_preview" [style.background-image]="'url(' + getBucketFilePath(model.image) + ')'"></div>
  </div>
  }
  <mat-card-content [ngClass]="{'with_image': !!model.image, 'without_image': !model.image}">
    <span class="text_date">{{ epochTo(model.created) }}</span>
    <p class="content_parent" [innerHTML]="sanitizeText(model.description, 256)"></p>
  </mat-card-content>
  <mat-card-actions>
    @if (config.shareLink) {
    <button matButton (click)="localShare('link')"><mat-icon>share</mat-icon></button>
    }
    @if (config.shareQR) {
    <button matButton (click)="localShare('qr')" class="icon_only"><mat-icon>qr_code</mat-icon></button>
    }
    @if (user && user.email == model.author) {
    <button matButton (click)="openEdit()" class="icon_only"><mat-icon>edit</mat-icon></button>
    <button matButton (click)="askDelete()" class="icon_only"><mat-icon>delete_forever</mat-icon></button>
    }
  </mat-card-actions>
</mat-card>
