<mat-card class="example-card" appearance="outlined">
  <form [formGroup]="form">
    <mat-card-header>
      <div mat-card-avatar class="example-header-image"></div>
      <mat-card-title>{{ model.title }}</mat-card-title>
      <mat-card-subtitle><app-editable-input formControlName="subtitle"></app-editable-input></mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu">
    <mat-card-content>
      <span class="text_date white_subtitle">Jan 13, 2026</span>
      <p class="content_parent" [innerHTML]="sanitizeText(model.description)"></p>
    </mat-card-content>
    <mat-card-actions>
      <button matButton>LIKE</button>
      <button matButton>SHARE</button>
    </mat-card-actions>
  </form>
</mat-card>
