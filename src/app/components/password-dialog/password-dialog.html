<h2 mat-dialog-title>{{ data.title || 'Ingresar contraseña' }}</h2>

<mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width top_gap">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="password" (keyup.enter)="password && confirm()" autofocus />
        <mat-icon matSuffix>lock</mat-icon>
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()">
        <mat-icon>close</mat-icon>
        Cancelar
    </button>

    <button mat-flat-button color="primary" [disabled]="!password" (click)="confirm()">
        <mat-icon>check</mat-icon>
        {{ data.buttonText || 'Confirmar' }}
    </button>
</mat-dialog-actions>
