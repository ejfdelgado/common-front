<div class="">
    <button class="transparent" (click)="setFullScreen(true)" *ngIf="!isFullScreen">
        <mat-icon [ngClass]="{'white_subtitle': useWhiteSubtitle }">fullscreen</mat-icon>
    </button>
    <button class="transparent" (click)="setFullScreen(false)" *ngIf="isFullScreen">
        <mat-icon [ngClass]="{'white_subtitle': useWhiteSubtitle }">fullscreen_exit</mat-icon>
    </button>
</div>
