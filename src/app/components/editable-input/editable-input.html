<div #editable class="editable-input" contenteditable="true" role="textbox" aria-multiline="false"
    [attr.aria-label]="ariaLabel" [attr.data-placeholder]="placeholder" [class.empty]="!value"
    [class.disabled]="disabled" [attr.tabindex]="disabled ? -1 : 0" (input)="onInput()" (blur)="onBlur()"
    (paste)="onPaste($event)">
</div>
