<div class="editable-wrapper" [ngClass]="{'visible': !discrete, 'focused': focused}">
    <!-- Toolbar -->
    @if (focused || !discrete) {
    <div class="toolbar">
        <button type="button" (mousedown)="format('bold', $event)" aria-label="Bold">
            <b>b</b>
        </button>

        <button type="button" (mousedown)="format('italic', $event)" aria-label="Italic">
            <i>It</i>
        </button>

        <button type="button" (mousedown)="openEmoticons()" aria-label="Italic">
            <span>😎</span>
        </button>
    </div>
    }
    <div #scrollContainer class="scrolled_content" [ngStyle]="{'min-height': discrete ? 'unset': minHeight+'em', 'max-height': discrete ? 'unset': maxHeight+'em'}">
        <div #editable [ngClass]="{'with_focus': focused}" class="editable-input" contenteditable="true" role="textbox"
            aria-multiline="false" [attr.data-placeholder]="placeholder" [class.empty]="!value"
            [class.disabled]="disabled" [attr.tabindex]="disabled ? -1 : 0" (focus)="onFocus()" (blur)="onBlur()"
            (input)="onInput()" (keyup)="saveSelection()" (mouseup)="saveSelection()" (paste)="onPaste($event)">
        </div>

    </div>
</div>
