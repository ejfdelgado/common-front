<div class="main_container">
    @if(user !== null) {
    <div class="menu_container">
        @if (iconSmall) {
        <button mat-icon-button color="primary" (click)="toggleSideNav()"
            aria-label="Open menu">
            <mat-icon>menu</mat-icon>
        </button>
        } @else {
        <button mat-fab color="primary" (click)="toggleSideNav()" aria-label="Open menu">
            <mat-icon>menu</mat-icon>
        </button>
        }
    </div>
    }
    <div class="title_content">
        <h1>{{ title }}</h1>
    </div>
    <div class="menu_container">
        @if (iconSmall) {
        @if(user == null) {
        <button mat-icon-button color="primary" [matMenuTriggerFor]="menu2" aria-label="Open menu">
            <mat-icon>face</mat-icon>
        </button>
        } @else {
        <button class="small_user_picture" [style.background-image]="'url(' + user.photoURL + ')'" mat-icon-button
            color="primary" [matMenuTriggerFor]="menu2" aria-label="Open menu">
        </button>
        }

        } @else {
        @if(user == null) {
        <button mat-fab color="primary" [matMenuTriggerFor]="menu2" aria-label="Open menu">
            <mat-icon>face</mat-icon>
        </button>
        } @else {
        <button mat-fab color="primary" class="small_user_picture"
            [style.background-image]="'url(' + user.displayName + ')'" [matMenuTriggerFor]="menu2"
            aria-label="Open menu">

        </button>
        }
        }
        <mat-menu #menu2="matMenu">
            @if(user == null) {
            <button mat-menu-item (click)="authSrv.loginWithGoogle()">
                <mat-icon>login</mat-icon>
                <span>Ingresar</span>
            </button>
            } @else {
            <button mat-menu-item>
                <div class="user_card">
                    <img class="card_photo" [src]="user.photoURL">
                    <div class="card_name_email">
                        <h6 class="text-sm">{{ user.displayName }}</h6>
                        <span class="email">{{ user.email }}</span>
                    </div>
                </div>
            </button>
            <hr class="local_hr">
            <button mat-menu-item (click)="authSrv.logout()">
                <mat-icon>logout</mat-icon>
                <span>Salir</span>
            </button>
            }
        </mat-menu>
    </div>
</div>
