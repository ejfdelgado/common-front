@if (status.value == 'online') {
<button (click)="broadcastBinaryData()">Send binary data</button>
<button (click)="disconnectFromRoom()">Disconnect</button>
} @else {
<button (click)="connectToRoom()">Connect</button>
}
<pre>{{ commonData | json }}</pre>

<button (click)="confirmThis('Pepe')">Confirm</button>
<span>{{ 'say_hi' | translate : 'test' | async }}</span>
