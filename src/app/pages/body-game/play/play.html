<div class="main_container">
    <app-side-menu [options]="menuOptions" [fontSize]="'large'"></app-side-menu>
    <div class="secondary_parent">
        <div class="dynamic_content">
            <app-body-tracker #tracker_component (events)="notifications($event)"></app-body-tracker>
        </div>
        <app-statusbar [config]="statusBarConfig" [title]="''"></app-statusbar>
    </div>
    <div class="chat_button_parent" [ngClass]="{'invisible': isAssistantOpened}">
        <div class="chat_button" (click)="openAssistant()">💬</div>
    </div>
    <iframe class="iframe_chat" [ngClass]="{'invisible': !isAssistantOpened}" [src]="getIframeSrc()"></iframe>
</div>
