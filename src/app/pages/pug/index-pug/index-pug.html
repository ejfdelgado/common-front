<div class="main_container">
    <app-side-menu [options]="menuOptions" [fontSize]="'large'"></app-side-menu>
    <div class="secondary_parent">
        <app-statusbar [title]="'Pugs'"></app-statusbar>
        <div class="dynamic_content">
            <div class="container_grid_docs_found">
                <div class="container_grid_docs_found_scroll">
                    <div class="grid_docs_found">
                        @for(pug of pugs; track pug.id) {
                        <app-card-doc [config]="cardConfig" [model]="pug" [user]="user"
                            (openDocument)="openDocument($event)" (createUpdate)="openDialog($event)"
                            (delete)="deleteDocument($event)" [imageType]="'thumbnail'"
                            (share)="localShare($event)"></app-card-doc>
                        }
                        <div class="see_more_parent" (click)="pageDocuments(false)">
                            <p>More</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
