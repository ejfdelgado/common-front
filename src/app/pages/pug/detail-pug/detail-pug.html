<div class="main_container">
    <div class="photo_container">
        <app-side-menu [options]="menuOptions"></app-side-menu>
        <div class="inner_photo_container">
            <app-statusbar [title]="getTitle()"></app-statusbar>
            <div class="dynamic_content">
                <app-threejs #three_pug_component class="content_column"></app-threejs>
                <div class="content_column">
                    @if (collection) {
                    <app-form-simple-with #inner_form class="column_equal" (jsonDataChange)="jsonDataChange($event)"
                        [fields]="fields" [model]="collection"></app-form-simple-with>
                    }
                    <div class="side_form column_equal">
                        <div class="action_buttons_parent">
                            <button mat-flat-button color="primary" (click)="makeAll()">
                                <mat-icon>check</mat-icon>
                                Generar
                            </button>
                            <button mat-button (click)="save()">
                                <mat-icon>save</mat-icon>
                                Guardar
                            </button>
                            <button mat-button (click)="download()">
                                <mat-icon>download</mat-icon>
                                Descargar
                            </button>
                            <button mat-button (click)="generateQRCode()">
                                <mat-icon>qr</mat-icon>
                                QR
                            </button>
                        </div>
                        <div class="thumbnails">
                            <canvas #full_texture width="2050" height="1000"></canvas>
                            <canvas #word_cloud_1 width="1" height="1"></canvas>
                            <canvas #word_cloud_2 width="1" height="1"></canvas>
                            <canvas #qrcanvas width="1" height="1"></canvas>
                            <img id="mask" src="/assets/img/pug/pug_mask.png" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
