<div class="main_container">
    <div class="photo_container">
        <app-side-menu [options]="menuOptions"></app-side-menu>
        <div class="inner_photo_container">
            <app-statusbar [title]="getTitle()"></app-statusbar>
            <div class="dynamic_content">
                <app-threejs class="content_column"></app-threejs>
                <div class="content_column">
                    @if (collection) {
                    <app-form-simple-with #inner_form (jsonDataChange)="jsonDataChange($event)" [fields]="fields"
                        [model]="collection"></app-form-simple-with>
                    }
                    <div class="action_buttons_parent">
                        <button mat-flat-button color="primary" (click)="renderWordCloud()">
                            <mat-icon>check</mat-icon>
                            Generar
                        </button>
                        <button mat-button (click)="save()">
                            <mat-icon>save</mat-icon>
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
            <div class="invisible">
                <canvas id="wordcloud1" width="512" height="512"></canvas>
                <canvas id="wordcloud2" width="512" height="512"></canvas>
                <img id="mask" src="/assets/img/pug_mask.png" />
            </div>
        </div>
    </div>
</div>
