<div class="full_screen container_vertical">
    <canvas id="canvas" width="500" height="500"></canvas>
    <app-threejs #three_component (headUpLog)="headUpLog($event)"></app-threejs>
    <div *ngIf="!started" class="start_container no_mouse">
        <button class="start_button" (click)="startTracking()">
            <mat-icon>play_arrow</mat-icon>
            <span>Start</span>
        </button>
    </div>
    <div class="top_absolute container_horizontal gap_10 padding_20">
        @if (!isRunning) {
        @for (lang of langs; track lang.id) {
        <span class="hand lang_option" [ngClass]="{'higlighted': lang.id==currentLang}"
            (click)="defineLanguage(lang)">{{ lang.icon }} {{
            lang.label }}</span>
        }
        }
    </div>
    <div class="top_absolute container_vertical gap_10 padding_20 head_up_log">
        <pre class="white_subtitle">{{ headUpLogData | json }}</pre>
    </div>


    <div class="bottom_absolute container_vertical padding_10">
        <span class="words_space">
            @for (word of words; track word.id) {
            <span [ngStyle]="{'color': word.color}" class="one_word white_subtitle">{{ word.word }} </span>
            }
        </span>
        <div class="container_horizontal centered">
            @if (!isRunning) {
            <button class="button_simple font_green" (click)="startListening()"><mat-icon
                    class="white">play_arrow</mat-icon></button>
            } @else {
            <button class="button_simple font_red" (click)="stopListening()"><mat-icon
                    class="white">pause</mat-icon></button>
            }
        </div>
    </div>
</div>
<div class="full_screen no_mouse container_vertical">
    <div class="video_parent">
        <video #video id="video" width="50" height="50">
            <source src="">
        </video>
    </div>
</div>
<app-fullscreen class="position_absolute bottom_right"></app-fullscreen>
