<div class="main_container">
    <div class="photo_container">
        <app-side-menu [options]="menuOptions"></app-side-menu>
        <div class="inner_photo_container">
            <app-statusbar [title]="getTitle()"></app-statusbar>
            <div class="dynamic_content">
                @if (collection) {
                <em class="header" [innerHTML]="sanitizeText(collection.description)"></em>
                }
                <div class="container_grid_docs_found">
                    <div class="container_grid_docs_found_scroll">
                        <div class="grid_docs_found">
                            @for(note of notes; track note.id) {
                            <app-photo-gallery [gallery]="note.gallery"></app-photo-gallery>
                            <p [innerHTML]="sanitizeText(note.description)" (click)="openDialog({'model': note})"></p>
                            }
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
