<p>index works!</p>
@if (!authSrv.isLoggedIn()) {
<button (click)="authSrv.login()">
    Login with Google
</button>
} @else {
<div>
    <img [src]="authSrv.user()?.picture" width="32" />
    <span>{{ authSrv.user()?.name }}</span>
    <button (click)="authSrv.logout()">Logout</button>
</div>
}
<button (click)="callPublic()">Call public</button>
<button (click)="callPrivate()">Call private</button>
<div [ngClass]="{'invisible': !authSrv.isLoggedIn()}">
    <span>Bucket</span>
    <app-camera-capture #camera_capture_bucket></app-camera-capture>
    <button (click)="deleteFile('bucket')">Delete</button>
</div>
<div [ngClass]="{'invisible': !authSrv.isLoggedIn()}">
    <span>Hard Drive</span>
    <app-camera-capture #camera_capture_harddrive></app-camera-capture>
    <button (click)="deleteFile('hard_drive')">Delete</button>
</div>
