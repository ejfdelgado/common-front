<p>{{ 234345435 | money }}</p>
<lib-money-display [amount]="234346546"></lib-money-display><br>
<button (click)="login()">Login</button>
<button (click)="logout()">Logout</button>

<button (click)="increment()">Inc</button>

<button (click)="callPublic()">Call public</button>
<button (click)="callPrivate()">Call private</button>
<div [ngClass]="{'invisible': !authSrv.isLoggedIn()}">
    <span>Bucket</span>
    <app-camera-capture #camera_capture_bucket></app-camera-capture>
    <button (click)="deleteFile('bucket')">Delete</button>
    <button (click)="openFile('bucket')">Open</button>
</div>
<div [ngClass]="{'invisible': !authSrv.isLoggedIn()}">
    <span>Hard Drive</span>
    <app-camera-capture #camera_capture_harddrive></app-camera-capture>
    <button (click)="deleteFile('hard_drive')">Delete</button>
    <button (click)="openFile('hard_drive')">Open</button>
</div>
<div>
    <span>Firestore</span>
    <button (click)="firestoreCreateUpdate()">Create / Update</button>
    <button (click)="firestoreCreateUpdate2()">Dynamic Create / Update</button>
    <button (click)="firestorePaginate()">Paginate</button>
</div>

<div class="leaderboard_sample">
    <span>Leaderboard - Write</span>
    <label>Room id <input type="text" [(ngModel)]="lbWriteRoomId" /></label>
    <label>Points <input type="number" [(ngModel)]="lbPoints" /></label>
    @if (!authSrv.isLoggedIn()) {
        <label>Display name <input type="text" [(ngModel)]="lbDisplayName" /></label>
    }
    <button (click)="leaderboardWrite()">Write</button>
    @if (lbWriteStatus) {
        <span>{{ lbWriteStatus }}</span>
    }
</div>

<div class="leaderboard_sample">
    <span>Leaderboard - Read</span>
    <label>Room id <input type="text" [(ngModel)]="lbReadRoomId" /></label>
    <button (click)="leaderboardRead()">Read</button>
    @if (lbActiveRoomId) {
        <app-leaderboard [roomId]="lbActiveRoomId"></app-leaderboard>
    }
</div>

<div class="form_sample">
    <app-form-simple-without [model]="model" [fields]="fields"></app-form-simple-without>
</div>
<pre>{{ model | json }}</pre>
<button (click)="loadTemplate()">Load template</button>
<div [innerHTML]="html"></div>
