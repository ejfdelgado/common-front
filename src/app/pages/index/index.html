<p>index works!</p>
<button (click)="login()">Login</button>
<button (click)="logout()">Logout</button>

<button (click)="callPublic()">Call public</button>
<button (click)="callPrivate()">Call private</button>
<div [ngClass]="{'invisible': !authSrv.isLoggedIn()}">
    <span>Bucket</span>
    <app-camera-capture #camera_capture_bucket></app-camera-capture>
    <button (click)="deleteFile('bucket')">Delete</button>
    <button (click)="openFile('bucket')">Open</button>
</div>
<div [ngClass]="{'invisible': !authSrv.isLoggedIn()}">
    <span>Hard Drive</span>
    <app-camera-capture #camera_capture_harddrive></app-camera-capture>
    <button (click)="deleteFile('hard_drive')">Delete</button>
    <button (click)="openFile('hard_drive')">Open</button>
</div>
<div>
    <span>Firestore</span>
    <button (click)="firestoreCreateUpdate()">Create / Update</button>
    <button (click)="firestoreCreateUpdate2()">Dynamic Create / Update</button>
    <button (click)="firestorePaginate()">Paginate</button>
</div>
