<h2 mat-dialog-title>Shared with</h2>
<mat-dialog-content>
    <div class="users_container_scrolled">
        <div class="users_container">
            @for (user of users; track user.uid) {
            <div class="user_card">
                <img class="card_photo" [src]="user.photoURL">
                <div class="card_name_email">
                    <h6 class="text-sm">{{ user.displayName }}</h6>
                    <span class="email">{{ user.email }}</span>
                </div>
            </div>
            }
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="openSearchUser()"><mat-icon>add</mat-icon>Add user</button>
    <button mat-button (click)="save()"><mat-icon>save</mat-icon>Save</button>
    <button mat-button (click)="close()"><mat-icon>close</mat-icon>Cancelar</button>
</mat-dialog-actions>
