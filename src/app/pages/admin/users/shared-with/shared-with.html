<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
    <div class="users_container_scrolled">
        <div class="users_container">
            @for (user of users; track user.uid) {
            <app-user-card [user]="user" [icon]="mode == 'normal' ? 'delete' : ''"
                (action)="removeUser(user)" (pickThis)="pickThis(user)"></app-user-card>
            }
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="close()"><mat-icon>close</mat-icon>Cancelar</button>
    @if (mode == "normal") {
    <button mat-flat-button color="primary" (click)="openSearchUser()"><mat-icon>add</mat-icon>Add user</button>
    @if (changesCount > 0) {
    <button mat-flat-button color="primary" (click)="save()"><mat-icon>save</mat-icon>Save</button>
    }
    }
</mat-dialog-actions>
