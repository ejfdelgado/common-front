<h2 mat-dialog-title>Search users</h2>
<mat-dialog-content>
    <app-search-input (search)="searchUser($event)"></app-search-input>
    <div class="users_container_scrolled">
        <div class="users_container">
            @for (user of usersMatched; track user.uid) {
            <app-user-card [user]="user" (pickThis)="selectUser(user)"></app-user-card>
            }
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="close()"><mat-icon>close</mat-icon>Cancelar</button>
</mat-dialog-actions>
