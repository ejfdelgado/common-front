<div class="main_container">
    <div class="photo_container">
        <app-side-menu [options]="menuOptions"></app-side-menu>
        <div class="inner_photo_container">
            <app-statusbar [title]="getTitle()"></app-statusbar>
            <div class="dynamic_content">
                <div class="container_grid_docs_found">
                    <div class="container_grid_docs_found_scroll">
                        <div class="detail_parent">
                            <h2>Perfil del negocio</h2>
                            <div class="client_profile_parent">
                                <div class="alegrias_container common_child">
                                    <h3>😃 Alegría</h3>
                                    <app-editable-input [discrete]="true"
                                        [(ngModel)]="content.profile.alegrias"></app-editable-input>
                                </div>
                                <div class="tareas_container common_child">
                                    <h3>👷👷‍♀️ Hábitos</h3>
                                    <app-editable-input [discrete]="true"
                                        [(ngModel)]="content.profile.habito"></app-editable-input>
                                    <h3>💬 Medios de comunicación</h3>
                                    <app-editable-input [discrete]="true"
                                        [(ngModel)]="content.profile.medio"></app-editable-input>
                                </div>
                                <div class="tristezas_container common_child">
                                    <h3>☹️ Frustraciones</h3>
                                    <app-editable-input [discrete]="true"
                                        [(ngModel)]="content.profile.frustraciones"></app-editable-input>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
