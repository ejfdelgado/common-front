<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body style="font-family: 'Inter', sans-serif; background-color: #f4f4f4;">
    <div style="padding: 50px 0;">
        <table
            style="margin: 0 auto; width: 800px; max-width: 800px; border: 1px solid; border-radius: 15px; padding: 40px 20px; border-color: rgb(181, 181, 181); background-color: aliceblue;">
            <tbody>
                <tr>
                    <td colspan="2">
                        <h1 style="margin-top: 0px;">${subject}</h1>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="background-color: rgb(206, 217, 255);"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <h2>Information:</h2>
                    </td>
                </tr>
                <tr>
                    <td><span style="display: block; padding: 10px 0;">${argument}:</span></td>
                    <td><strong style="display: block; padding: 10px 0;">${value}</strong></td>
                </tr>
                <tr>
                    <td colspan="2" style="background-color: rgb(206, 217, 255);"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <h2>History:</h2>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="padding-bottom: 15px; padding-right: 30%;"><span
                            style="display: block; background-color: rgb(198, 228, 255); padding: 10px; border-radius: 10px; padding-right: 50%; position: relative;"><span style="font-size: 0.8rem; position: absolute; top: -15px;">Assistant:</span>${message}</span></td>
                </tr>
                <tr>
                    <td colspan="2" style="padding-bottom: 15px; padding-left: 30%;"><span
                            style="display: block; background-color: rgb(216, 216, 216); padding: 10px; border-radius: 10px; padding-right: 50%;">This is another text</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
